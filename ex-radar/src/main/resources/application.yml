spring:
  application:
    name: ex-radar
  jpa:
    open-in-view: false
  flyway:
    enabled: true
  thymeleaf:
    cache: true
  profiles:
    default: dev
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
exradar:
  analytics:
    measurement-id: ${GA4_MEASUREMENT_ID:}
    ga4:
      property-id: ${GA4_PROPERTY_ID:}
      service-account-key: ${GA4_SERVICE_ACCOUNT_KEY:}
  seo:
    default-og-image: ${OG_DEFAULT_IMAGE_URL:}
    # staging等、検索エンジンに一切載せたくない環境でのみ明示的にfalseを設定する。
    # 未設定時はtrue(=本番のSEO仕様)になるため、設定し忘れても誤ってnoindexにはならない。
    indexable: ${SEO_INDEXABLE:true}
