spring:
  datasource:
    url: jdbc:h2:file:./data/exradar;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  thymeleaf:
    cache: false
  h2:
    console:
      enabled: true
      path: /h2-console
exradar:
  admin:
    email: ${EXRADAR_ADMIN_EMAIL}
  analytics:
    measurement-id: ${GA4_MEASUREMENT_ID:}
