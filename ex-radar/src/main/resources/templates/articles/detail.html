<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title th:text="${article.title} + ' | EXレーダー'">記事タイトル | EXレーダー</title>
    <meta name="description" th:content="${article.description}" />
    <link rel="canonical" th:href="${canonicalUrl}" />
    <meta name="robots" content="index, follow" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <header>
      <a class="brand" href="/">EXレーダー</a>
      <nav>
        <a href="/articles">記事一覧</a
        ><a class="button header-login" sec:authorize="isAnonymous()" href="/login">ログイン</a
        ><a class="button" sec:authorize="isAuthenticated()" href="/experiences/new">投稿する</a>
      </nav>
    </header>
    <main class="detail-page">
      <article>
        <div class="detail-hero">
          <p class="eyebrow" th:text="${#temporals.format(article.publishedAt, 'yyyy/MM/dd')}">公開日</p>
          <h1 th:text="${article.title}">記事タイトル</h1>
        </div>
        <section class="story-section article-body" th:utext="${contentHtml}"></section>
        <section class="lesson-spotlight">
          <p class="eyebrow">FROM READING TO YOUR OWN STORY</p>
          <h2>あなたの失敗から得た教訓を残してみませんか？</h2>
          <p>
            EXレーダーは、経験者の教訓や失敗を判断材料として共有するサービスです。あなた自身の経験も、これから決める誰かの助けになります。
          </p>
          <a class="button" href="/experiences/new">体験談を投稿する</a>
        </section>
      </article>
    </main>
  </body>
</html>
