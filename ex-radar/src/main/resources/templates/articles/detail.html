<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <title th:text="${article.effectiveSeoTitle} + ' | EXレーダー'">記事タイトル | EXレーダー</title>
    <th:block
      th:replace="~{fragments/seo :: meta(
        title=${article.effectiveSeoTitle},
        description=${article.effectiveMetaDescription},
        canonicalUrl=${canonicalUrl},
        ogType='article')}"
    ></th:block>
    <meta name="robots" content="index, follow" />
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/site-nav.js" defer></script>
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <div th:replace="~{fragments/header :: siteHeader}"></div>
    <main class="detail-page">
      <article>
        <div class="detail-hero">
          <p class="eyebrow" th:text="${#temporals.format(article.publishedAt, 'yyyy/MM/dd')}">公開日</p>
          <h1 th:text="${article.title}">記事タイトル</h1>
        </div>
        <section class="story-section article-body" th:utext="${contentHtml}"></section>
        <section class="lesson-spotlight">
          <p class="eyebrow">FROM READING TO YOUR OWN STORY</p>
          <h2>あなたの失敗から得た教訓を残してみませんか？</h2>
          <p>
            EXレーダーは、経験者の教訓や失敗を判断材料として共有するサービスです。あなた自身の経験も、これから決める誰かの助けになります。
          </p>
          <a class="button button-learning" href="/experiences/new">体験談を投稿する</a>
        </section>
      </article>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
