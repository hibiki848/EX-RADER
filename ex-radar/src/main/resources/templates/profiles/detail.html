<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title th:text="${profile.displayName}+'さん | EXレーダー'"></title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <header>
      <a class="brand" href="/">EXレーダー</a>
      <nav><a href="/experiences">体験談を探す</a></nav>
    </header>
    <main class="explore-page">
      <section class="profile-head">
        <p class="eyebrow">CONTRIBUTOR</p>
        <h1 th:text="${profile.displayName}+'さん'"></h1>
        <p th:if="${profile.biography}" th:text="${profile.biography}"></p>
        <div class="tags">
          <span th:if="${profile.ageGroup}" th:text="${profile.ageGroup}"></span
          ><span
            th:if="${profile.occupation}"
            th:text="${profile.occupation}"
          ></span>
        </div>
      </section>
      <h2>公開している体験談</h2>
      <div class="card-grid">
        <a
          class="experience-card"
          th:each="p:${result.content}"
          th:href="@{/experiences/{id}(id=${p.id})}"
          ><span class="eyebrow" th:text="${p.category}"></span>
          <h3 th:text="${p.title}"></h3
        ></a>
      </div>
      <div class="empty-state" th:if="${result.empty}">
        公開中の体験談はありません。
      </div>
    </main>
  </body>
</html>
