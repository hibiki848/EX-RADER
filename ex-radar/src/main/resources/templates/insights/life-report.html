<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <meta name="robots" content="noindex, nofollow" />
    <title>人生レポート | EXレーダー</title>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/insights.css" />
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <header>
      <a class="brand" href="/">EXレーダー</a
      ><a href="/insights">あなたの分析</a>
    </header>
    <main class="insight-page">
      <div class="insight-hero reveal">
        <p class="eyebrow">MY LIFE REPORT</p>
        <h1>選択を、一本のルートとして眺める</h1>
        <p><strong th:text="${report.postCount}">0</strong>件の選択から作成</p>
      </div>
      <aside class="data-note">
        比較値は投稿データ上の傾向です。あなたの人生を評価・診断するものではありません。
      </aside>
      <section class="panel">
        <div class="metric-row">
          <div>
            <span>平均満足</span
            ><b th:text="${report.averageSatisfaction}+'/10'">0</b>
          </div>
          <div>
            <span>平均後悔</span
            ><b th:text="${report.averageRegret}+'/10'">0</b>
          </div>
          <div>
            <span>もう一度選ぶ</span
            ><b th:text="${report.chooseAgainPercentage}+'%'">0</b>
          </div>
        </div>
        <h2>経験カテゴリ</h2>
        <div class="chips">
          <span
            th:each="c:${report.categories}"
            th:text="${c.label}+' '+${c.count}"
            >カテゴリ</span
          >
        </div>
      </section>
      <section class="panel route">
        <h2>あなたのルート</h2>
        <ol>
          <li th:each="r:${report.route}">
            <small th:text="${r.timing}">時期</small
            ><strong th:text="${r.choice}">選択</strong
            ><span th:text="${r.category}+' — '+${r.event}">出来事</span>
          </li>
        </ol>
        <p th:if="${report.route.empty}">
          体験談を投稿すると、ここにルートが描かれます。
        </p>
      </section>
      <section class="report-counts">
        <div><b th:text="${report.postCount}">0</b><span>自分の投稿</span></div>
        <div>
          <b th:text="${report.referencedPostCount}">0</b
          ><span>参考データ</span>
        </div>
        <div>
          <b th:text="${report.similarPostCount}">0</b><span>似ている投稿</span>
        </div>
        <div>
          <b th:text="${report.similarUserCount}">0</b><span>似ている人</span>
        </div>
      </section>
    </main>
  </body>
</html>
