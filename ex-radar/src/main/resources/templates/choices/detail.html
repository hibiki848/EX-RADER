<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <meta name="robots" content="noindex, nofollow" />
    <title th:text="${category.name}+'の経験者の知恵 | EXレーダー'"></title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <header>
      <a class="brand" href="/">EXレーダー</a><a href="/choices">選択肢一覧</a>
    </header>
    <main class="explore-page">
      <p class="eyebrow">WISDOM GUIDE</p>
      <h1 th:text="${category.name}+'を経験した人から学ぶ'"></h1>
      <aside class="data-note">
        ここでは「選ぶべき」という結論は出しません。さまざまな経験を、自分で考えるための判断材料としてご覧ください。
      </aside>
      <p th:if="${selectedValueNames}">
        あなたが大切にしている観点に触れた経験を先に表示しています：<span
          th:each="v:${selectedValueNames}"
          th:text="${v}+' '"
        ></span>
      </p>
      <div class="wisdom-grid">
        <article class="wisdom-card" th:each="p:${experiences}">
          <span th:text="${p.title}"></span>
          <h2>この経験から得た教訓</h2>
          <blockquote th:text="${p.lesson?:p.adviceToPastSelf}"></blockquote>
          <h3>選ぶ前に知っておきたかったこと</h3>
          <p th:text="${p.wishKnown?:p.unexpectedThings}"></p>
          <h3>大変だったこと</h3>
          <p th:text="${p.difficulties}"></p>
          <div class="tags">
            <span th:each="v:${p.values}" th:text="${v.name}"></span>
          </div>
          <a th:href="@{/experiences/{id}(id=${p.id})}">この経験を詳しく読む</a>
        </article>
      </div>
      <p class="empty" th:if="${experiences.empty}">
        この選択の経験はまだ投稿されていません。
      </p>
    </main>
  </body>
</html>
