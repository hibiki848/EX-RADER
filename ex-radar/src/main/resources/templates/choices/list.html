<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <meta name="robots" content="noindex, nofollow" />
    <title>教訓まとめ | EXレーダー</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/site-nav.js" defer></script>
    <script src="/js/choices-list.js" defer></script>
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <div th:replace="~{fragments/header :: siteHeader}"></div>
    <main class="explore-page lessons-page">
      <div class="page-heading">
        <p class="eyebrow">LESSONS</p>
        <h1>教訓まとめ</h1>
        <p>
          みんなの体験談から得られた教訓だけを、すばやく読み進められます。カテゴリやタグ、キーワードで絞り込めます。
        </p>
      </div>

      <form class="search-panel lessons-search-form" method="get" action="/choices">
        <input type="hidden" name="category" th:value="${selectedCategorySlug}" />
        <input type="hidden" name="view" th:value="${view}" />
        <label
          >教訓・タグを検索<input
            name="q"
            th:value="${keyword}"
            placeholder="例：転職 / 後悔 / 一人暮らし" /></label
        ><label
          >タグで絞り込む<input
            name="tag"
            th:value="${tagQuery}"
            list="lesson-tag-suggestions"
            placeholder="例：転職" /></label
        ><button>この条件で絞り込む</button><a href="/choices">条件をクリア</a>
      </form>
      <datalist id="lesson-tag-suggestions">
        <option th:each="t:${popularTags}" th:value="${t.name}"></option>
      </datalist>

      <nav class="lesson-category-bar" aria-label="カテゴリで絞り込む">
        <a
          class="lesson-category-chip"
          th:classappend="${selectedCategorySlug == null or #strings.isEmpty(selectedCategorySlug)} ? ' is-active'"
          th:href="@{/choices(tag=${tagQuery}, q=${keyword}, view=${view})}"
          >すべて</a
        >
        <a
          class="lesson-category-chip"
          th:each="c:${categories}"
          th:classappend="${selectedCategorySlug == c.slug} ? ' is-active'"
          th:href="@{/choices(category=${c.slug}, tag=${tagQuery}, q=${keyword}, view=${view})}"
          th:text="${c.name}"
        ></a>
      </nav>

      <div class="results-toolbar">
        <p th:text="${result.totalElements}+'件の教訓'"></p>
        <div class="list-view-toggle" role="group" aria-label="表示切り替え">
          <button
            type="button"
            th:classappend="${view == 'simple'} ? ' is-active'"
            th:attr="aria-pressed=${view == 'simple'}"
            data-lesson-view="simple"
          >
            簡易表示
          </button>
          <button
            type="button"
            th:classappend="${view == 'detailed'} ? ' is-active'"
            th:attr="aria-pressed=${view == 'detailed'}"
            data-lesson-view="detailed"
          >
            詳細表示
          </button>
        </div>
      </div>

      <div
        class="card-grid lesson-card-grid"
        th:attr="data-view=${view}"
      >
        <article
          class="lesson-card category-accent reveal"
          th:each="p:${result.content}"
          th:attr="data-category=${p.category}"
        >
          <div class="lesson-card-top">
            <span class="category-badge" th:text="${p.category}"></span>
            <span class="card-date" th:text="${#temporals.format(p.createdAt, 'yyyy.MM.dd')}"></span>
          </div>
          <p class="lesson-card-text" th:text="${p.learned ?: p.lesson}"></p>
          <div class="tags" th:if="${not #lists.isEmpty(p.tags)}">
            <span th:each="tag:${p.tags}" th:text="'#'+${tag}"></span>
          </div>
          <div class="lesson-card-detail">
            <h3 th:text="${p.title}"></h3>
            <p class="card-excerpt" th:if="${p.situationBefore}" th:text="${p.situationBefore}"></p>
            <p
              class="card-meta-line"
              th:text="${p.author}+'さんの体験談 ・ '+${#temporals.format(p.createdAt, 'yyyy.MM.dd')}+' 投稿'"
            ></p>
            <a class="button button-secondary" th:href="@{/experiences/{id}(id=${p.id})}">この体験談を読む</a>
          </div>
        </article>
      </div>

      <div class="empty-state" th:if="${result.empty}">
        <h2>条件に一致する教訓はありませんでした。</h2>
        <p><a href="/choices">条件をクリア</a></p>
      </div>

      <nav class="lesson-pagination" aria-label="ページ送り" th:if="${result.totalPages > 1}">
        <a
          class="button button-secondary"
          th:if="${result.hasPrevious()}"
          th:href="@{/choices(category=${selectedCategorySlug}, tag=${tagQuery}, q=${keyword}, view=${view}, page=${result.number - 1})}"
          >前へ</a
        >
        <span th:text="(${result.number}+1)+' / '+${result.totalPages}"></span>
        <a
          class="button button-secondary"
          th:if="${result.hasNext()}"
          th:href="@{/choices(category=${selectedCategorySlug}, tag=${tagQuery}, q=${keyword}, view=${view}, page=${result.number + 1})}"
          >次へ</a
        >
      </nav>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
