<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <meta name="robots" content="noindex, nofollow" />
    <title>人生の選択肢 | EXレーダー</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/site-nav.js" defer></script>
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <div th:replace="~{fragments/header :: siteHeader}"></div>
    <main class="explore-page">
      <div class="page-heading">
        <p class="eyebrow">CHOICE GUIDES</p>
        <h1>人生の選択肢から知恵を探す</h1>
        <p>
          結論ではなく、先に経験した人が知っておきたかったことや教訓をまとめています。
        </p>
      </div>
      <div class="card-grid">
        <a
          class="experience-card"
          th:each="c:${categories}"
          th:href="@{/choices/{slug}(slug=${c.slug})}"
          ><h2 th:text="${c.name}"></h2>
          <p>経験者の知恵を見る</p></a
        >
      </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
