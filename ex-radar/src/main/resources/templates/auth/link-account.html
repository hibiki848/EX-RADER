<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>アカウント連携の確認 | EXレーダー</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <main class="auth">
      <a class="brand" href="/">EXレーダー</a>
      <section class="panel">
        <h1>アカウント連携の確認</h1>
        <p>
          <strong th:text="${email}">email@example.com</strong>
          は既にEXレーダーに登録されています。パスワードを入力すると、このGoogleアカウントを既存のアカウントに連携します。連携後は「Googleで続ける」だけでログインできるようになり、これまでどおりメールアドレスとパスワードでのログインも引き続き利用できます。
        </p>
        <p class="error" th:if="${linkError}" th:text="${linkError}"></p>
        <form th:action="@{/oauth2/link-account}" th:object="${linkAccountForm}" method="post">
          <label
            >パスワード<input
              th:field="*{password}"
              type="password"
              autocomplete="current-password"
              required /><small th:errors="*{password}"></small></label
          ><button class="button" type="submit">連携してログイン</button>
        </form>
        <p><a href="/login">これは自分ではありません(キャンセル)</a></p>
      </section>
    </main>
  </body>
</html>
