<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>新規登録 | EXレーダー</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <main class="auth">
      <a class="brand" href="/">EXレーダー</a>
      <section class="panel">
        <h1>新規登録</h1>
        <form
          th:action="@{/register}"
          th:object="${registrationForm}"
          method="post"
        >
          <label
            >表示名<input
              th:field="*{displayName}"
              maxlength="50"
              required /><small th:errors="*{displayName}"></small></label
          ><label
            >メールアドレス<input
              th:field="*{email}"
              type="email"
              maxlength="254"
              required /><small th:errors="*{email}"></small></label
          ><label
            >パスワード（8文字以上）<input
              th:field="*{password}"
              type="password"
              minlength="8"
              maxlength="72"
              required /><small th:errors="*{password}"></small></label
          ><label
            >パスワード（確認）<input
              th:field="*{passwordConfirmation}"
              type="password"
              required /><small
              th:errors="*{passwordConfirmation}"
            ></small></label
          ><button class="button" type="submit">登録する</button>
        </form>
        <p><a href="/login">ログインへ戻る</a></p>
      </section>
    </main>
  </body>
</html>
