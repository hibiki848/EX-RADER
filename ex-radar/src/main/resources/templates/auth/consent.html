<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <title>利用規約への同意 | EXレーダー</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <div th:replace="~{fragments/header :: siteHeaderMinimal}"></div>
    <main class="auth">
      <section class="panel">
        <h1>利用規約への同意</h1>
        <p>EXレーダーを利用するには、利用規約およびプライバシーポリシーをご確認ください。</p>
        <form th:action="@{/auth/consent}" th:object="${termsConsentForm}" method="post">
          <label class="agree-to-terms"
            ><input th:field="*{agreedToTerms}" type="checkbox" required /><span
              >「<a href="/terms" target="_blank" rel="noopener noreferrer">利用規約</a>」および「<a
                href="/privacy"
                target="_blank"
                rel="noopener noreferrer"
                >プライバシーポリシー</a
              >」に同意する</span
            ><small th:errors="*{agreedToTerms}"></small></label
          ><button class="button" type="submit">同意して利用を開始する</button>
        </form>
      </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
