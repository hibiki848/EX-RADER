<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <meta name="robots" content="noindex, nofollow" />
    <title>ログイン | EXレーダー</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <div th:replace="~{fragments/header :: siteHeaderMinimal}"></div>
    <main class="auth">
      <section class="panel">
        <h1>ログイン</h1>
        <p th:if="${registered}" class="success">
          登録が完了しました。ログインしてください。
        </p>
        <p th:if="${param.logout}" class="success">ログアウトしました。</p>
        <p th:if="${param.error != null and param.error[0] == 'oauth_suspended'}" class="error">
          このアカウントは利用停止されています。
        </p>
        <p th:if="${param.error != null and param.error[0] == 'oauth_email'}" class="error">
          Googleアカウントの確認済みメールアドレスを取得できませんでした。
        </p>
        <p
          th:if="${param.error != null and (param.error[0] == '' or param.error[0] == 'oauth_failed')}"
          class="error"
        >
          メールアドレスまたはパスワードが正しくありません。
        </p>
        <th:block th:if="${googleLoginEnabled}">
          <div th:replace="~{fragments/google-signin :: google-signin}"></div>
        </th:block>
        <form th:action="@{/login}" method="post">
          <label
            >メールアドレス<input
              name="username"
              type="email"
              autocomplete="email"
              required /></label
          ><label
            >パスワード<input
              name="password"
              type="password"
              autocomplete="current-password"
              required /></label
          ><button class="button" type="submit">ログイン</button>
        </form>
        <p>初めての方は <a href="/register">新規登録</a></p>
      </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
