<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ログイン | EXレーダー</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <main class="auth">
      <a class="brand" href="/">EXレーダー</a>
      <section class="panel">
        <h1>ログイン</h1>
        <p th:if="${registered}" class="success">
          登録が完了しました。ログインしてください。
        </p>
        <p th:if="${param.error}" class="error">
          メールアドレスまたはパスワードが正しくありません。
        </p>
        <p th:if="${param.logout}" class="success">ログアウトしました。</p>
        <form th:action="@{/login}" method="post">
          <label
            >メールアドレス<input
              name="username"
              type="email"
              autocomplete="email"
              required /></label
          ><label
            >パスワード<input
              name="password"
              type="password"
              autocomplete="current-password"
              required /></label
          ><button class="button" type="submit">ログイン</button>
        </form>
        <p>初めての方は <a href="/register">新規登録</a></p>
      </section>
    </main>
  </body>
</html>
