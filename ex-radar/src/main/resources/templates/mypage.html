<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>マイページ</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <header>
      <a class="brand" href="/">EXレーダー</a>
      <nav>
        <a href="/experiences">体験談</a
        ><a href="/mypage/notifications"
          >通知
          <b
            class="badge"
            th:if="${unreadNotificationCount>0}"
            th:text="${unreadNotificationCount}"
          ></b
        ></a>
        <form th:action="@{/logout}" method="post">
          <button type="submit">ログアウト</button>
        </form>
      </nav>
    </header>
    <main class="page account-page">
      <section class="panel reveal">
        <h1 th:text="|${user.displayName}さんのマイページ|">マイページ</h1>
        <div class="account-actions">
          <a class="button" href="/mypage/profile">プロフィール編集</a
          ><a href="/mypage/password">パスワード変更</a
          ><a href="/insights">経験を振り返る</a
          ><a href="/mypage/values">大切にしたい価値観</a
          ><a href="/decision-memos">意思決定メモ</a
          ><a th:if="${user.role.name() == 'ADMIN'}" href="/admin">管理者画面</a>
        </div>
      </section>
      <section class="account-grid">
        <article class="panel reveal">
          <h2>自分の投稿</h2>
          <p th:if="${#lists.isEmpty(posts)}">投稿はまだありません。</p>
          <ul>
            <li th:each="p:${posts}">
              <a
                th:href="@{/experiences/{id}(id=${p.id})}"
                th:text="${p.title}"
              ></a>
            </li>
          </ul>
        </article>
        <article class="panel reveal">
          <h2>下書き</h2>
          <p th:if="${#lists.isEmpty(drafts)}">下書きはまだありません。</p>
          <ul>
            <li th:each="d:${drafts}">
              <a
                th:href="@{/experiences/{id}/edit(id=${d.id})}"
                th:text="${#strings.isEmpty(d.title) ? '無題の下書き' : d.title}"
              ></a>
              <small th:text="${#temporals.format(d.updatedAt, 'yyyy/MM/dd HH:mm')}"></small>
              <form
                th:action="@{/experiences/{id}/delete(id=${d.id})}"
                method="post"
                style="display:inline"
                onsubmit="return confirm('この下書きを削除しますか？');"
              >
                <button type="submit" class="text-button">削除</button>
              </form>
            </li>
          </ul>
        </article>
        <article class="panel reveal">
          <h2>リアクション履歴</h2>
          <p th:if="${#lists.isEmpty(reactions)}">
            リアクションはまだありません。
          </p>
          <ul>
            <li th:each="r:${reactions}">
              <span th:text="${r.type}"></span> —
              <a
                th:href="@{/experiences/{id}(id=${r.post.id})}"
                th:text="${r.post.title}"
              ></a>
            </li>
          </ul>
        </article>
      </section>
      <section class="panel account-danger reveal">
        <h2>アカウント削除</h2>
        <p>アカウント、投稿、コメント、リアクション、意思決定メモなど、関連するデータをすべて削除します。この操作は取り消せません。</p>
        <p class="error" th:if="${accountDeleteError}" th:text="${accountDeleteError}"></p>
        <form th:action="@{/mypage/delete}" method="post" onsubmit="return confirm('アカウントと関連データをすべて削除します。よろしいですか？');">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <label>確認のため現在のパスワードを入力<input type="password" name="password" required /></label>
          <button class="button button-danger" type="submit">アカウントを完全に削除</button>
        </form>
      </section>
    </main>
  </body>
</html>
