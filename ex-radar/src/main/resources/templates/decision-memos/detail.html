<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <meta name="robots" content="noindex, nofollow" />
    <title th:text="${memo.title}+' | EXレーダー'"></title>
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/site-nav.js" defer></script>
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <div th:replace="~{fragments/header :: siteHeader}"></div>
    <main class="page">
      <a class="back-link" href="/decision-memos">← メモ一覧に戻る</a>
      <section class="panel memo-detail">
        <p class="private-note">このメモは本人だけが見られます</p>
        <h1 th:text="${memo.title}"></h1>
        <h2>今悩んでいること</h2>
        <p th:text="${memo.concern}"></p>
        <h2>選択肢</h2>
        <p th:text="${memo.optionsText}"></p>
        <div class="tags">
          <span th:each="v:${memo.values}" th:text="${v.name}"></span>
        </div>
        <h2>不安</h2>
        <p th:text="${memo.anxieties?:'まだ書かれていません'}"></p>
        <h2>得たいもの／失いたくないもの</h2>
        <p th:text="${memo.desiredGain}"></p>
        <p th:text="${memo.mustNotLose}"></p>
        <h2>読んで気づいたこと</h2>
        <p th:text="${memo.discoveries?:'これから追記できます'}"></p>
        <blockquote
          th:if="${memo.helpfulLessons}"
          th:text="${memo.helpfulLessons}"
        ></blockquote>
        <h2>現時点の考え</h2>
        <p
          th:text="${memo.currentThoughts?:'考えが整理できたら追記しましょう'}"
        ></p>
        <div class="owner-actions">
          <a
            class="button"
            th:href="@{/decision-memos/{id}/edit(id=${memo.id})}"
            >追記・編集</a
          >
          <form
            th:action="@{/decision-memos/{id}/delete(id=${memo.id})}"
            method="post"
          >
            <button class="danger">削除</button>
          </form>
        </div>
      </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
