<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <meta name="robots" content="noindex, nofollow" />
    <title>意思決定メモ | EXレーダー</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <header>
      <a class="brand" href="/">EXレーダー</a>
      <nav><a href="/mypage">マイページ</a></nav>
    </header>
    <main class="page">
      <div class="section-heading">
        <div>
          <p class="eyebrow">DECISION NOTES</p>
          <h1>意思決定メモ</h1>
          <p>答えを急がず、今の考えと読んで気づいたことを自分だけの記録に。</p>
        </div>
        <a class="button" href="/decision-memos/new">新しいメモ</a>
      </div>
      <div class="memo-list">
        <a
          class="panel"
          th:each="memo:${memos}"
          th:href="@{/decision-memos/{id}(id=${memo.id})}"
          ><h2 th:text="${memo.title}"></h2>
          <p th:text="${memo.concern}"></p>
          <small
            th:text="${#temporals.format(memo.updatedAt,'yyyy/MM/dd HH:mm')}+' 更新'"
          ></small
        ></a>
      </div>
      <p class="empty" th:if="${memos.empty}">まだメモはありません。</p>
    </main>
  </body>
</html>
