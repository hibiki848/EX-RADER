<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>大切にしたい価値観 | EXレーダー</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <header>
      <a class="brand" href="/">EXレーダー</a>
      <nav><a href="/mypage">マイページ</a></nav>
    </header>
    <main class="page">
      <section class="panel">
        <p class="eyebrow">YOUR PERSPECTIVES</p>
        <h1>人生で大切にしたいこと</h1>
        <p>
          ここで選んだ価値観は、選択肢を推薦するためではなく、あなたが気になる観点の経験を見つけやすくするために使います。
        </p>
        <p class="success" th:if="${param.saved}">価値観を保存しました。</p>
        <form
          th:action="@{/mypage/values}"
          th:object="${valueSelectionForm}"
          method="post"
        >
          <div class="value-grid">
            <label class="value-choice" th:each="v:${personalValues}"
              ><input
                type="checkbox"
                th:field="*{valueIds}"
                th:value="${v.id}" /><span th:text="${v.name}"></span
            ></label>
          </div>
          <button>大切にしたいことを保存</button>
        </form>
      </section>
    </main>
  </body>
</html>
