<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <meta name="robots" content="noindex, nofollow" />
    <title th:text="${recipient.message.title} + ' | EXレーダー'"></title>
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/site-nav.js" defer></script>
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <div th:replace="~{fragments/header :: siteHeader}"></div>
    <main class="page">
      <a class="back-link" href="/mypage/notifications">← 通知一覧に戻る</a>
      <section class="panel reveal">
        <p class="eyebrow" th:text="${#temporals.format(recipient.message.sentAt,'yyyy/MM/dd HH:mm')} + ' 配信'"></p>
        <h1 th:text="${recipient.message.title}"></h1>
        <p th:text="${recipient.message.body}" style="white-space: pre-wrap"></p>
        <p th:if="${recipient.message.linkUrl}">
          <a class="button" th:href="${recipient.message.linkUrl}" target="_blank" rel="noopener noreferrer">詳しく見る</a>
        </p>
      </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
