<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <meta name="robots" content="noindex, nofollow" />
    <title>プロフィール編集</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/site-nav.js" defer></script>
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <div th:replace="~{fragments/header :: siteHeader}"></div>
    <main class="page">
      <nav class="page-links" aria-label="マイページ関連">
        <a href="/mypage">← マイページに戻る</a>
        <a href="/mypage/notifications"
          >通知
          <b
            class="notify-badge"
            th:if="${unreadNotificationCount>0}"
            th:text="${unreadNotificationCount}"
          ></b
        ></a>
      </nav>
      <section class="panel reveal">
        <h1>プロフィール編集</h1>
        <p class="success" th:if="${success}" th:text="${success}"></p>
        <form
          th:action="@{/mypage/profile}"
          th:object="${profileForm}"
          method="post"
        >
          <label
            >表示名<input th:field="*{displayName}" maxlength="50" /><small
              th:errors="*{displayName}"
            ></small></label
          ><label>年代<input th:field="*{ageGroup}" maxlength="20" /></label
          ><label>学歴<input th:field="*{education}" maxlength="100" /></label
          ><label>職業<input th:field="*{occupation}" maxlength="100" /></label
          ><label
            >都道府県<input th:field="*{prefecture}" maxlength="20" /></label
          ><label
            >自己紹介<textarea
              th:field="*{biography}"
              maxlength="1000"
              rows="6"
            ></textarea
            ><small th:errors="*{biography}"></small></label
          ><button>保存する</button>
        </form>
      </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
