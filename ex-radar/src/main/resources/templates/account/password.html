<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>パスワード変更</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <header>
      <a class="brand" href="/">EXレーダー</a>
      <nav><a href="/mypage">マイページ</a></nav>
    </header>
    <main class="page">
      <section class="panel reveal">
        <h1>パスワード変更</h1>
        <p class="success" th:if="${success}" th:text="${success}"></p>
        <form
          th:action="@{/mypage/password}"
          th:object="${passwordChangeForm}"
          method="post"
        >
          <div
            class="error"
            th:if="${#fields.hasGlobalErrors()}"
            th:each="e:${#fields.globalErrors()}"
            th:text="${e}"
          ></div>
          <label
            >現在のパスワード<input
              type="password"
              th:field="*{currentPassword}"
              autocomplete="current-password" /></label
          ><label
            >新しいパスワード<input
              type="password"
              th:field="*{newPassword}"
              autocomplete="new-password" /><small
              th:errors="*{newPassword}"
            ></small></label
          ><label
            >新しいパスワード（確認）<input
              type="password"
              th:field="*{confirmation}"
              autocomplete="new-password" /></label
          ><button>変更する</button>
        </form>
      </section>
    </main>
  </body>
</html>
