<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <title>エラーが発生しました | EXレーダー</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/header :: siteHeaderMinimal}"></div>
    <main class="panel page" th:switch="${status}">
      <p class="eyebrow" th:text="${status}">エラー</p>
      <h1 th:case="400">リクエストの内容に誤りがあります</h1>
      <h1 th:case="401">ログインが必要です</h1>
      <h1 th:case="*">問題が発生しました</h1>
      <p th:text="${message} ?: 'このページを表示できませんでした。'">
        このページを表示できませんでした。
      </p>
      <a class="button" href="/">トップへ戻る</a>
    </main>
  </body>
</html>
