<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <meta name="robots" content="noindex, nofollow" />
    <title th:text="${post.title} + ' | 簡易表示'">簡易表示 | EXレーダー</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <main class="summary-page">
      <article class="summary-card">
        <div class="summary-head">
          <p class="eyebrow" th:text="${post.category.name}">カテゴリ</p>
          <h1 th:text="${post.title}">体験談のタイトル</h1>
          <p th:text="${post.author.displayName} + 'さんの体験談'">投稿者</p>
        </div>
        <div class="summary-facts">
          <span th:text="'満足度 ' + ${post.satisfaction} + '/10'">満足度</span>
          <span th:text="'後悔度 ' + ${post.regret} + '/10'">後悔度</span>
          <span th:if="${post.currentAgeGroup}" th:text="${post.currentAgeGroup}">年代</span>
        </div>
        <section class="summary-section">
          <h2>この経験の要点</h2>
          <div class="summary-item"><h3>選択前の状況</h3><p th:text="${post.situationBefore}">内容</p></div>
          <div class="summary-item"><h3>選んだこと</h3><p th:text="${post.choiceMade}">内容</p></div>
          <div class="summary-item"><h3>その後の結果</h3><p th:text="${post.outcome}">内容</p></div>
          <div class="summary-item" th:if="${wisdomUnlocked}"><h3>経験して分かったこと</h3><p th:text="${wisdom.learned ?: wisdom.lesson ?: wisdom.adviceToPastSelf}">内容</p></div>
          <div class="summary-item" th:if="${wisdomUnlocked}"><h3>今ならどうするか</h3><p th:text="${wisdom.adviceToPastSelf}">内容</p></div>
          <div class="summary-item wisdom-gate" th:unless="${wisdomUnlocked}">
            <h3>この経験から得た教訓</h3>
            <p>🔒 あなたの経験を1つ投稿すると読めます。</p>
            <a class="button" href="/experiences/new">体験談を投稿する</a>
          </div>
        </section>
        <div class="summary-actions">
          <a class="button" th:href="@{/experiences/{id}(id=${post.id})}">詳細ページで読む</a>
          <a href="/experiences">一覧へ戻る</a>
        </div>
      </article>
    </main>
  </body>
</html>
