<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>経験を分けて、知恵を読む | EXレーダー</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <header>
      <a class="brand" href="/">EXレーダー</a>
      <nav><a href="/experiences">経験を探す</a></nav>
    </header>
    <main class="page">
      <section class="panel unlock-message">
        <p class="eyebrow">GIVE TO GET</p>
        <h1>経験をひとつ分けると、経験者の知恵を読めます</h1>
        <p>
          EXレーダーは、一人ひとりが経験から得た教訓を持ち寄る場所です。公開された体験談を1件投稿すると、ほかの人の体験談・教訓・選ぶ前に知っておきたかったことを読めるようになります。
        </p>
        <aside class="data-note">
          投稿するのは成功談でなくても構いません。失敗、想定外だったこと、今なら伝えたいことも、誰かが自分で考えるための大切な判断材料になります。
        </aside>
        <div class="account-actions" th:if="${loggedIn and !alreadyUnlocked}">
          <a class="button" href="/experiences/new"
            >自分の経験と教訓を投稿する</a
          >
          <a href="/mypage">マイページへ</a>
        </div>
        <div class="account-actions" th:unless="${loggedIn}">
          <a class="button" href="/register">登録して経験を投稿する</a>
          <a href="/login">ログイン</a>
        </div>
        <div th:if="${alreadyUnlocked}">
          <a class="button" href="/experiences">体験談を探す</a>
        </div>
      </section>
    </main>
  </body>
</html>
