<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <meta name="robots" content="noindex, nofollow" />
    <title>選択肢ガイドを使う | EXレーダー</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/site-nav.js" defer></script>
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <div th:replace="~{fragments/header :: siteHeader}"></div>
    <main class="page">
      <section class="panel unlock-message">
        <p class="eyebrow">CHOICE GUIDE</p>
        <h1>経験をひとつ分けると、選択肢ガイドが使えます</h1>
        <p>
          体験談そのものは、どなたでも自由に読むことができます。この「選択肢ガイド」は、あなたが大切にしたい価値観に合わせて経験者の知恵を絞り込んで表示する機能で、公開された体験談を1件投稿すると使えるようになります。
        </p>
        <aside class="data-note">
          投稿するのは成功談でなくても構いません。失敗、想定外だったこと、今なら伝えたいことも、誰かが自分で考えるための大切な判断材料になります。
        </aside>
        <div class="account-actions" th:if="${loggedIn and !alreadyUnlocked}">
          <a class="button" href="/experiences/new"
            >自分の経験と教訓を投稿する</a
          >
          <a href="/mypage">マイページへ</a>
        </div>
        <div class="account-actions" th:unless="${loggedIn}">
          <a class="button" href="/register">登録して経験を投稿する</a>
          <a href="/login">ログイン</a>
        </div>
        <div th:if="${alreadyUnlocked}">
          <a class="button" href="/choices">選択肢ガイドを見る</a>
        </div>
      </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
