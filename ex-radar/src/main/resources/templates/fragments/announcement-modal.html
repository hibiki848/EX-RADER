<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <body>
    <!--/* ログイン後お知らせモーダル。pendingAnnouncement(AdminAnnouncementRecipient)が
         NavigationAdviceでモデルへ入っている場合のみ描画する(=このタイミングで
         firstDisplayedAt/lastDisplayedAt/displayCountは既にサーバー側で記録済み)。
         CSRFトークンはページ全体の<meta>に依存せず、このdiv自身のdata属性として
         埋め込む(fragments/announcement-modal.jsが読む)ことで、どのページからでも
         th:replaceするだけで動作するようにしている。 */-->
    <div
      th:fragment="modal"
      th:if="${pendingAnnouncement != null}"
      id="announcement-modal"
      class="announcement-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="announcement-modal-title"
      th:data-recipient-id="${pendingAnnouncement.id}"
      th:data-csrf-token="${_csrf.token}"
      th:data-csrf-header="${_csrf.headerName}"
    >
      <div class="announcement-backdrop" data-announcement-close></div>
      <div class="announcement-modal-card">
        <button type="button" class="announcement-close" data-announcement-close aria-label="閉じる">×</button>
        <p class="eyebrow">お知らせ</p>
        <h2 id="announcement-modal-title" th:text="${pendingAnnouncement.announcement.title}"></h2>
        <p class="announcement-body" th:text="${pendingAnnouncement.announcement.body}"></p>
        <div class="announcement-actions">
          <a
            th:if="${pendingAnnouncement.announcement.linkUrl}"
            class="button"
            th:href="${pendingAnnouncement.announcement.linkUrl}"
            th:target="${pendingAnnouncement.announcement.linkUrl.startsWith('http')} ? '_blank' : '_self'"
            rel="noopener noreferrer"
            >詳しく見る</a
          >
          <button type="button" class="button-secondary" data-announcement-close>閉じる</button>
        </div>
        <label class="announcement-dismiss-option">
          <input type="checkbox" id="announcement-dismiss-permanently" />
          次回以降このお知らせを表示しない
        </label>
      </div>
      <!--/* モーダルが実際に描画される(=表示対象がある)時だけ読み込む。全ページの<head>に
           個別追加する必要がないよう、th:ifで囲われたこの要素の内側にscriptを置いている。 */-->
      <script src="/js/announcement-modal.js" defer></script>
    </div>
  </body>
</html>
