<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <body>
    <!--/* 通常ユーザー向けページの共通ヘッダー。center nav / 右側の認証状態別アクションを持つ。
         th:fragmentの値はタグ名(header)と衝突させない(Thymeleafのフラグメント選択はタグ名にも
         マッチするため、"header"という名前だと2つの<header>要素の両方が選択されてしまう)。 */-->
    <th:block th:fragment="siteHeader">
    <header>
      <div class="site-header-inner">
        <a class="brand" href="/"><span class="brand-ex">EX</span>レーダー</a>
        <nav class="site-nav" aria-label="メインナビゲーション">
          <ul class="site-nav-links">
            <li><a href="/experiences">体験談を探す</a></li>
            <li><a href="/choices">教訓まとめ</a></li>
            <li><a href="/articles">記事</a></li>
            <li><a href="/experiences/new">新規投稿</a></li>
          </ul>
          <div class="site-nav-actions">
            <a class="button header-login" sec:authorize="isAnonymous()" href="/login">ログイン</a>
            <a class="button" sec:authorize="isAnonymous()" href="/register">無料ではじめる</a>
            <a class="button-secondary button" sec:authorize="isAuthenticated()" href="/mypage"
              >マイページ<b class="notify-badge" th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}" th:text="${unreadNotificationCount}"></b
            ></a>
            <a class="button admin-nav-button" sec:authorize="hasRole('ADMIN')" href="/admin">管理者画面</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
              <button class="header-logout" type="submit">ログアウト</button>
            </form>
          </div>
        </nav>
        <button class="nav-toggle" type="button" data-nav-toggle aria-label="メニューを開く" aria-expanded="false">
          <span class="nav-toggle-bars" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <!--/* スマートフォン表示専用の画面下固定ナビゲーション(Indeedアプリ等に見られる形式)。
         900px以下でのみ表示され(app.css側でdisplay制御)、PC表示には影響しない。
         現在地のハイライトはsite-nav.jsがdata-bottom-nav属性を見て付与する。 */-->
    <nav class="bottom-nav" aria-label="モバイルナビゲーション">
      <a href="/" data-bottom-nav="home">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 10.5 12 4l8 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M6 9.5V19a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M10 20v-5h4v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>ホーム</span>
      </a>
      <a href="/experiences" data-bottom-nav="experiences">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8" />
          <path d="m20 20-4.8-4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <span>体験談を探す</span>
      </a>
      <a href="/experiences/new" class="bottom-nav-post" data-bottom-nav="post">
        <span class="bottom-nav-post-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </span>
        <span>投稿</span>
      </a>
      <a href="/mypage/notifications" data-bottom-nav="notifications">
        <span class="bottom-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 10a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
            <path d="M10 18.5a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <b class="notify-badge" th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}" th:text="${unreadNotificationCount}"></b>
        </span>
        <span>通知</span>
      </a>
      <a href="/mypage" data-bottom-nav="mypage">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.8" />
          <path d="M4.8 19.5c1-3.4 3.9-5.5 7.2-5.5s6.2 2.1 7.2 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>マイページ</span>
      </a>
    </nav>
    </th:block>

    <!--/* 認証ページ・エラーページ用の簡易ヘッダー(ロゴのみ、ナビ無し)。 */-->
    <header th:fragment="siteHeaderMinimal">
      <div class="site-header-inner">
        <a class="brand" href="/"><span class="brand-ex">EX</span>レーダー</a>
      </div>
    </header>

    <!--/* 管理画面専用サブナビ。共通headerには管理者専用リンクを置かないため、
         管理画面配下のページ本文にこれを差し込み、既存の管理者導線を維持する。
         current: 'dashboard' | 'articles' | 'reports' */-->
    <nav th:fragment="adminSubnav(current)" class="admin-subnav" aria-label="管理画面ナビゲーション">
      <a href="/admin" th:classappend="${current == 'dashboard'} ? ' is-active'">管理者ダッシュボード</a>
      <a href="/admin/articles" th:classappend="${current == 'articles'} ? ' is-active'">記事管理</a>
      <a href="/admin/reports" th:classappend="${current == 'reports'} ? ' is-active'">通報管理</a>
    </nav>
  </body>
</html>
