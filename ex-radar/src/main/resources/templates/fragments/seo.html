<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <body>
    <!--
      description / canonicalUrl / ogTypeを渡してmeta description・canonical・OGPをまとめて出力する。
      og:imageは個別ページに画像フィールドがないため、共通のデフォルト画像(defaultOgImage、
      未設定なら何も出力しない)を全ページで使う。titleはページごとの<title>タグをそのまま使うため
      ここでは扱わず、og:titleにのみ引数で受け取ったtitleを使う。
    -->
    <th:block th:fragment="meta(title, description, canonicalUrl, ogType)">
      <meta
        th:if="${seoIndexable == false}"
        name="robots"
        content="noindex,nofollow,noarchive"
      />
      <meta
        th:if="${description != null and !#strings.isEmpty(description)}"
        name="description"
        th:content="${description}"
      />
      <link th:if="${canonicalUrl != null}" rel="canonical" th:href="${canonicalUrl}" />
      <meta property="og:title" th:content="${title}" />
      <meta
        th:if="${description != null and !#strings.isEmpty(description)}"
        property="og:description"
        th:content="${description}"
      />
      <meta th:if="${canonicalUrl != null}" property="og:url" th:content="${canonicalUrl}" />
      <meta property="og:type" th:content="${ogType}" />
      <meta
        th:if="${defaultOgImage != null and !#strings.isEmpty(defaultOgImage)}"
        property="og:image"
        th:content="${defaultOgImage}"
      />
    </th:block>
  </body>
</html>
