<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block th:fragment="analytics">
      <th:block th:if="${gaMeasurementId != null and !#strings.isEmpty(gaMeasurementId)}">
        <script async th:src="|https://www.googletagmanager.com/gtag/js?id=${gaMeasurementId}|"></script>
        <script th:inline="javascript">
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', /*[[${gaMeasurementId}]]*/ '');
        </script>
      </th:block>
    </th:block>
  </body>
</html>
