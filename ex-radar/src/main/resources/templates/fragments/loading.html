<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block th:fragment="loading">
      <div id="page-loader" class="page-loader" role="status" aria-label="読み込み中">
        <span class="page-loader-spinner"></span>
      </div>
      <noscript>
        <style>
          #page-loader {
            display: none !important;
          }
        </style>
      </noscript>
      <script>
        (function () {
          var loader = document.getElementById('page-loader');
          if (!loader) return;

          var pending = [];
          var windowLoaded = false;
          var hidden = false;
          var SAFETY_TIMEOUT_MS = 8000;
          var FADE_MS = 300;

          function tryHide() {
            if (hidden || !windowLoaded || pending.length > 0) return;
            hide();
          }

          function hide() {
            if (hidden) return;
            hidden = true;
            loader.classList.add('is-hidden');
            window.setTimeout(function () {
              loader.hidden = true;
            }, FADE_MS);
          }

          window.addEventListener('load', function () {
            windowLoaded = true;
            tryHide();
          });

          // 通信が長時間終わらない場合でもローディングが残り続けないようにする安全策
          window.setTimeout(hide, SAFETY_TIMEOUT_MS);

          // 各ページの非同期処理(fetch等)を登録すると、それらの完了(成功・失敗いずれも)も待ってから非表示にする
          window.ExRadarLoader = {
            wait: function (promise) {
              if (!promise || typeof promise.then !== 'function') return promise;
              pending.push(promise);
              var settle = function () {
                var index = pending.indexOf(promise);
                if (index !== -1) pending.splice(index, 1);
                tryHide();
              };
              promise.then(settle, settle);
              return promise;
            }
          };
        })();
      </script>
    </th:block>
  </body>
</html>
