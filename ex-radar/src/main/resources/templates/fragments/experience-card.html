<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <body>
    <!--/*
      体験談カードの共通コンポーネント。トップページ「新着の体験談」と
      検索一覧(experiences/list.html)の両方から使う。
      引数:
        p           ExperienceCardDto
        wisdomUnlocked boolean
        modalPrefix 簡易表示モーダルのid接頭辞(ページごとにid衝突しないよう分ける)
        extraClass  呼び出し元が追加したいCSSクラス(トップページの.latest-card等。無ければ'')
        gateActionsToAuth 「簡易表示・詳細ページ」操作を認証必須にするか。
          トップページの新着セクションは従来どおりtrue(未ログイン非表示)、
          検索一覧は従来どおりfalse(未ログインでも詳細ページへ遷移できる)を渡し、
          共通化前の各ページの挙動をそのまま維持する。
      「詳細表示」で追加される要素(タグ・満足度)は常にDOM上へ出力し、
      表示切替は祖先要素の[data-view]属性によるCSSのみで行う(JS側での再描画が不要なため)。
    */-->
    <article
      class="experience-card category-accent reveal"
      th:fragment="card(p, wisdomUnlocked, modalPrefix, extraClass, gateActionsToAuth)"
      th:classappend="${extraClass}"
      th:attr="data-category=${p.category}"
    >
      <div class="card-top">
        <span class="category-badge" th:text="${p.category}"></span>
        <span class="read-badge" th:if="${p.read}">既読</span>
        <span class="card-date" th:text="${#temporals.format(p.createdAt, 'yyyy.MM.dd')}"></span>
      </div>
      <h3 th:text="${p.title}"></h3>
      <p class="card-excerpt" th:if="${p.situationBefore}" th:text="${p.situationBefore}"></p>
      <div class="card-detail-extra">
        <p class="card-meta-line" th:text="${p.author}+'さん ・ 満足度 '+${p.satisfaction}+'/10'"></p>
        <div class="tags" th:if="${not #lists.isEmpty(p.tags)}">
          <span th:each="tag:${p.tags}" th:text="'#'+${tag}"></span>
        </div>
      </div>
      <div class="card-lesson">
        <p class="card-lesson-label">得られた教訓</p>
        <p th:if="${wisdomUnlocked}" th:text="${p.learned ?: (p.lesson ?: 'この体験談にはまだ教訓が記載されていません')}"></p>
        <p th:unless="${wisdomUnlocked}" class="wisdom-teaser-note">🔒 体験談を投稿すると読めます</p>
      </div>
      <div class="experience-card-actions" th:if="${!gateActionsToAuth}">
        <button
          class="button button-secondary"
          type="button"
          th:attr="data-summary-target=|${modalPrefix}${p.id}|"
        >
          簡易表示
        </button>
        <a th:href="@{/experiences/{id}(id=${p.id})}">詳細ページ</a>
      </div>
      <div class="experience-card-actions" th:if="${gateActionsToAuth}" sec:authorize="isAuthenticated()">
        <button
          class="button button-secondary"
          type="button"
          th:attr="data-summary-target=|${modalPrefix}${p.id}|"
        >
          簡易表示
        </button>
        <a th:href="@{/experiences/{id}(id=${p.id})}">詳細ページ</a>
      </div>
    </article>
  </body>
</html>
