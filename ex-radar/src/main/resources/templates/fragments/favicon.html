<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <body>
    <!--
      サイト共通のfavicon。既存のレーダー・ターコイズ系デザイン(hero内の.radar要素、
      --teal/--warmのブランドカラー)に合わせたSVGを主として使い、Google検索結果や
      apple-touch-icon等のPNGが必要な文脈向けにラスタライズ済みPNGも並べて出力する。
      画像ファイルが実在するもの以外は出力しない(存在しないURLをheadへ書かない)。
    -->
    <th:block th:fragment="links">
      <link rel="icon" type="image/svg+xml" href="/images/favicon/favicon.svg" />
      <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon/favicon.png" />
      <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png" />
    </th:block>
  </body>
</html>
