<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <title>配信履歴 | EXレーダー</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/site-nav.js" defer></script>
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <div th:replace="~{fragments/header :: siteHeader}"></div>
    <main class="page admin-page">
      <div th:replace="~{fragments/header :: adminSubnav(current='messages')}"></div>
      <div class="page-heading">
        <p class="eyebrow">ADMIN CONSOLE</p>
        <h1>メッセージ配信</h1>
        <p>これまでに配信したメッセージの一覧です。</p>
        <p><a class="button" href="/admin">← 管理者ダッシュボードでユーザーを選ぶ</a></p>
      </div>
      <p class="success" th:if="${success}" th:text="${success}"></p>

      <section class="panel reveal">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>タイトル</th>
                <th>送信者</th>
                <th>送信日時</th>
                <th>配信人数</th>
                <th>既読人数</th>
                <th>未読人数</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="m : ${result.content}" class="admin-user-row" th:attr="data-url=@{/admin/messages/{id}(id=${m.id})}" tabindex="0">
                <td data-label="タイトル"><a class="admin-user-link" th:href="@{/admin/messages/{id}(id=${m.id})}"><strong th:text="${m.title}"></strong></a></td>
                <td data-label="送信者" th:text="${m.createdByAdminDisplayName}"></td>
                <td data-label="送信日時" th:text="${#temporals.format(m.sentAt, 'yyyy/MM/dd HH:mm')}"></td>
                <td data-label="配信人数" th:text="${m.deliveredCount}"></td>
                <td data-label="既読人数" th:text="${m.readCount}"></td>
                <td data-label="未読人数" th:text="${m.unreadCount}"></td>
              </tr>
            </tbody>
          </table>
        </div>
        <p class="empty-state" th:if="${result.empty}">配信履歴はまだありません。</p>

        <nav class="pagination" th:if="${result.totalPages > 1}">
          <a th:if="${result.hasPrevious()}" th:href="@{/admin/messages(page=${result.number - 1})}">前へ</a
          ><span th:text="${result.number + 1}+'/'+${result.totalPages}"></span
          ><a th:if="${result.hasNext()}" th:href="@{/admin/messages(page=${result.number + 1})}">次へ</a>
        </nav>
      </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script>
      document.querySelectorAll('.admin-user-row').forEach(function (row) {
        row.addEventListener('click', function (event) {
          if (event.target.closest('a, button, form')) return;
          window.location.href = row.dataset.url;
        });
        row.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') window.location.href = row.dataset.url;
        });
      });
    </script>
  </body>
</html>
