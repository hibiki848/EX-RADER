<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <meta name="robots" content="noindex, nofollow" />
    <title>通報管理 | EXレーダー</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/site-nav.js" defer></script>
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <div th:replace="~{fragments/header :: siteHeader}"></div>
    <main class="page admin-page">
      <div th:replace="~{fragments/header :: adminSubnav(current='reports')}"></div>
      <div class="page-heading">
        <p class="eyebrow">ADMIN CONSOLE</p>
        <h1>通報管理</h1>
        <p>体験談・コメントの通報を確認し、ステータス変更や非公開・削除の対応ができます。</p>
      </div>
      <p class="success" th:if="${success}" th:text="${success}"></p>
      <p class="error" th:if="${error}" th:text="${error}"></p>
      <section class="panel reveal admin-users">
        <div class="section-heading">
          <div>
            <h2>通報一覧</h2>
            <p th:text="${#lists.size(reports)}+'件の通報'">件数</p>
          </div>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>通報日時</th>
                <th>種別</th>
                <th>通報対象</th>
                <th>通報理由</th>
                <th>通報者</th>
                <th>対象の投稿者</th>
                <th>ステータス</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="r : ${reports}">
                <td th:text="${#temporals.format(r.createdAt, 'yyyy/MM/dd HH:mm')}">2026/01/01</td>
                <td th:text="${r.targetType.name() == 'EXPERIENCE_POST' ? '体験談' : 'コメント'}">種別</td>
                <td>
                  <a
                    th:if="${r.targetExists}"
                    th:href="@{/experiences/{id}(id=${r.targetPostId})}"
                    th:text="${r.targetSummary}"
                  >対象</a>
                  <span th:unless="${r.targetExists}" th:text="${r.targetSummary}">対象</span>
                </td>
                <td th:text="${r.reason}">理由</td>
                <td>
                  <strong th:text="${r.reporterDisplayName}">通報者</strong>
                  <small th:text="${r.reporterEmail}">email</small>
                </td>
                <td th:text="${r.targetAuthorDisplayName ?: '-'}">投稿者</td>
                <td>
                  <span
                    class="status-badge"
                    th:classappend="${r.status.name() == 'PENDING'} ? ' is-stopped' : ''"
                    th:text="${r.status.displayName()}"
                  >ステータス</span>
                </td>
                <td class="admin-actions">
                  <form th:action="@{/admin/reports/{id}/status(id=${r.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <select name="status">
                      <option
                        th:each="s : ${T(com.exradar.entity.ReportStatus).values()}"
                        th:if="${s.name() != 'HIDDEN' and s.name() != 'DELETED'}"
                        th:value="${s.name()}"
                        th:text="${s.displayName()}"
                        th:selected="${s == r.status}"
                      ></option>
                    </select>
                    <button class="button button-secondary" type="submit">変更</button>
                  </form>
                  <form
                    th:if="${r.targetType.name() == 'EXPERIENCE_POST' and r.targetExists}"
                    th:action="@{/admin/reports/{id}/hide(id=${r.id})}"
                    method="post"
                    onsubmit="return confirm('対象の体験談を非公開(下書き)に戻します。よろしいですか？');"
                  >
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button class="button button-secondary" type="submit">非公開にする</button>
                  </form>
                  <form
                    th:if="${r.targetExists}"
                    th:action="@{/admin/reports/{id}/delete(id=${r.id})}"
                    method="post"
                    onsubmit="return confirm('対象を完全に削除します。この操作は取り消せません。よろしいですか？');"
                  >
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button class="button button-danger" type="submit">削除する</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <p th:if="${#lists.isEmpty(reports)}">通報はまだありません。</p>
      </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
