<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <title th:text="${milestoneId != null ? '投稿報酬設定を編集' : '投稿報酬設定を追加'}+' | EXレーダー'"></title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/site-nav.js" defer></script>
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <div th:replace="~{fragments/header :: siteHeader}"></div>
    <main class="form-page">
      <div th:replace="~{fragments/header :: adminSubnav(current='reward-milestones')}"></div>
      <a class="back-link" href="/admin/reward-milestones">← 投稿報酬設定一覧に戻る</a>
      <div class="page-heading">
        <p class="eyebrow">ADMIN CONSOLE</p>
        <h1 th:text="${milestoneId != null ? '投稿報酬設定を編集' : '投稿報酬設定を追加'}"></h1>
        <p>必要投稿数に達したユーザーへ自動付与する特典を設定します(1つの必要投稿数につき1設定)。</p>
      </div>

      <form
        class="experience-form"
        th:object="${postRewardMilestoneForm}"
        th:action="${milestoneId != null ? '/admin/reward-milestones/'+milestoneId+'/edit' : '/admin/reward-milestones'}"
        method="post"
      >
        <div class="error-summary" th:if="${#fields.hasAnyErrors()}" role="alert">
          <strong>入力内容を確認してください</strong>
          <ul>
            <li th:each="e:${#fields.allErrors()}" th:text="${e}"></li>
          </ul>
        </div>
        <p class="error" th:if="${formError}" th:text="${formError}"></p>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <section class="panel form-section">
          <label
            >必要投稿数（必須）<input type="number" min="1" th:field="*{requiredPostCount}" /><small th:errors="*{requiredPostCount}"></small
          ></label>
          <label
            >配布する特典（必須）<select th:field="*{benefitDefinitionId}">
              <option value="">選択してください</option>
              <option th:each="b:${benefitOptions}" th:value="${b.id}" th:text="${b.name}"></option>
            </select><small th:errors="*{benefitDefinitionId}"></small
          ></label>
          <label
            >繰り返し間隔（任意）<input type="number" min="1" th:field="*{repeatInterval}" placeholder="例: 10（この間隔で無限に繰り返す。空欄なら1回のみ）" /><small th:errors="*{repeatInterval}"></small
          ></label>
          <label>表示順<input type="number" th:field="*{displayOrder}" step="1" /></label>
        </section>

        <button type="submit" th:text="${milestoneId != null ? '更新する' : '作成する'}"></button>
      </form>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
