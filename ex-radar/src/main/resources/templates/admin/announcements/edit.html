<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <title th:text="${announcement.title} + ' を編集 | EXレーダー'"></title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/site-nav.js" defer></script>
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <div th:replace="~{fragments/header :: siteHeader}"></div>
    <main class="form-page">
      <div th:replace="~{fragments/header :: adminSubnav(current='announcements')}"></div>
      <a class="back-link" th:href="@{/admin/announcements/{id}(id=${announcement.id})}">← お知らせ詳細に戻る</a>
      <div class="page-heading">
        <p class="eyebrow">ADMIN CONSOLE</p>
        <h1>お知らせを編集</h1>
        <p>配信対象は作成時点で確定済みのため、ここでは内容・配信期間・優先度のみ変更できます。</p>
      </div>

      <form class="experience-form" th:object="${adminAnnouncementForm}" th:action="@{/admin/announcements/{id}/edit(id=${announcement.id})}" method="post">
        <div class="error-summary" th:if="${#fields.hasAnyErrors()}" role="alert">
          <strong>入力内容を確認してください</strong>
          <ul>
            <li th:each="e:${#fields.allErrors()}" th:text="${e}"></li>
          </ul>
        </div>
        <p class="error" th:if="${dateError}" th:text="${dateError}"></p>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <section class="panel form-section">
          <h2>内容</h2>
          <label>タイトル（必須）<input th:field="*{title}" maxlength="200" /><small th:errors="*{title}"></small></label>
          <label>本文（必須）<textarea th:field="*{body}" maxlength="4000" rows="8"></textarea><small th:errors="*{body}"></small></label>
          <label
            >リンク（任意）<input th:field="*{linkUrl}" maxlength="500" placeholder="https://ex-radar.jp/... または /experiences/1" /><span class="field-hint"
              >http(s)から始まるURL、または/から始まるサイト内パスを指定できます。</span
            ><small th:errors="*{linkUrl}"></small
          ></label>
        </section>

        <section class="panel form-section">
          <h2>配信期間・優先度</h2>
          <label
            >配信開始日時（必須）<input type="datetime-local" th:field="*{startsAt}" /><small th:errors="*{startsAt}"></small
          ></label>
          <label
            >配信終了日時（任意）<input type="datetime-local" th:field="*{endsAt}" /><small th:errors="*{endsAt}"></small
          ></label>
          <label>優先度<input type="number" th:field="*{priority}" step="1" /></label>
        </section>

        <button type="submit">更新する</button>
      </form>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
