<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <title th:text="${announcement.title} + ' | ログイン時お知らせ | EXレーダー'"></title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/site-nav.js" defer></script>
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <div th:replace="~{fragments/header :: siteHeader}"></div>
    <main class="detail-page">
      <div th:replace="~{fragments/header :: adminSubnav(current='announcements')}"></div>
      <a class="back-link" href="/admin/announcements">← お知らせ一覧に戻る</a>
      <p class="success" th:if="${success}" th:text="${success}"></p>

      <article class="detail-hero panel">
        <p class="eyebrow">
          <span th:class="${announcement.published ? 'status-badge' : 'status-badge is-stopped'}" th:text="${announcement.published ? '公開中' : '非公開'}"></span>
          配信期間: <span th:text="${#temporals.format(announcement.startsAt, 'yyyy/MM/dd HH:mm')}"></span> 〜
          <span th:text="${announcement.endsAt != null ? #temporals.format(announcement.endsAt, 'yyyy/MM/dd HH:mm') : '指定なし'}"></span>
          （優先度: <span th:text="${announcement.priority}"></span>）
        </p>
        <h1 th:text="${announcement.title}"></h1>
        <p th:text="${announcement.createdByAdmin != null ? announcement.createdByAdmin.displayName + 'さんが作成' : '作成した管理者は退会済みです'}"></p>
        <div class="admin-actions">
          <a class="button button-secondary" th:href="@{/admin/announcements/{id}/edit(id=${announcement.id})}">内容を編集</a>
          <form th:if="${!announcement.published}" th:action="@{/admin/announcements/{id}/publish(id=${announcement.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="button" type="submit">公開する</button>
          </form>
          <form th:if="${announcement.published}" th:action="@{/admin/announcements/{id}/unpublish(id=${announcement.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="button-danger" type="submit">非公開にする</button>
          </form>
        </div>
      </article>

      <section class="panel story-section">
        <h2>本文</h2>
        <p th:text="${announcement.body}" style="white-space: pre-wrap"></p>
        <p th:if="${announcement.linkUrl}"><a th:href="${announcement.linkUrl}" target="_blank" rel="noopener noreferrer" th:text="${announcement.linkUrl}"></a></p>
      </section>

      <section class="panel story-section">
        <h2>配信対象(<span th:text="${#lists.size(recipients)}"></span>人)</h2>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>ユーザー</th><th>表示回数</th><th>初回表示</th><th>最終表示</th><th>永久非表示</th></tr></thead>
            <tbody>
              <tr th:each="r : ${recipients}">
                <td><strong th:text="${r.user.displayName}"></strong><small th:text="${r.user.email}"></small></td>
                <td th:text="${r.displayCount}"></td>
                <td th:text="${r.firstDisplayedAt != null ? #temporals.format(r.firstDisplayedAt, 'yyyy/MM/dd HH:mm') : '—'}"></td>
                <td th:text="${r.lastDisplayedAt != null ? #temporals.format(r.lastDisplayedAt, 'yyyy/MM/dd HH:mm') : '—'}"></td>
                <td th:text="${r.dismissedPermanentlyAt != null ? #temporals.format(r.dismissedPermanentlyAt, 'yyyy/MM/dd HH:mm') : '—'}"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
