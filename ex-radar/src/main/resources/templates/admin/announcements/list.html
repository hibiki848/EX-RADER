<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <title>ログイン時お知らせ | EXレーダー</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/site-nav.js" defer></script>
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <div th:replace="~{fragments/header :: siteHeader}"></div>
    <main class="page admin-page">
      <div th:replace="~{fragments/header :: adminSubnav(current='announcements')}"></div>
      <div class="page-heading">
        <p class="eyebrow">ADMIN CONSOLE</p>
        <h1>ログイン時お知らせ</h1>
        <p>ログイン後のページ表示時に画面中央モーダルで表示するお知らせの一覧です。</p>
        <p><a class="button" href="/admin">← 管理者ダッシュボードでユーザーを選ぶ</a></p>
      </div>
      <p class="success" th:if="${success}" th:text="${success}"></p>

      <section class="panel reveal">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>タイトル</th>
                <th>状態</th>
                <th>作成者</th>
                <th>配信開始</th>
                <th>配信終了</th>
                <th>配信人数</th>
                <th>表示済み人数</th>
                <th>永久非表示人数</th>
              </tr>
            </thead>
            <tbody>
              <tr
                th:each="a : ${result.content}"
                class="admin-user-row"
                th:attr="data-url=@{/admin/announcements/{id}(id=${a.id})}"
                tabindex="0"
              >
                <td data-label="タイトル"><a class="admin-user-link" th:href="@{/admin/announcements/{id}(id=${a.id})}"><strong th:text="${a.title}"></strong></a></td>
                <td data-label="状態"><span th:class="${a.published ? 'status-badge' : 'status-badge is-stopped'}" th:text="${a.published ? '公開中' : '非公開'}"></span></td>
                <td data-label="作成者" th:text="${a.createdByAdminDisplayName}"></td>
                <td data-label="配信開始" th:text="${#temporals.format(a.startsAt, 'yyyy/MM/dd HH:mm')}"></td>
                <td data-label="配信終了" th:text="${a.endsAt != null ? #temporals.format(a.endsAt, 'yyyy/MM/dd HH:mm') : '指定なし'}"></td>
                <td data-label="配信人数" th:text="${a.deliveredCount}"></td>
                <td data-label="表示済み人数" th:text="${a.displayedCount}"></td>
                <td data-label="永久非表示人数" th:text="${a.dismissedPermanentlyCount}"></td>
              </tr>
            </tbody>
          </table>
        </div>
        <p class="empty-state" th:if="${result.empty}">お知らせはまだありません。</p>

        <nav class="pagination" th:if="${result.totalPages > 1}">
          <a th:if="${result.hasPrevious()}" th:href="@{/admin/announcements(page=${result.number - 1})}">前へ</a
          ><span th:text="${result.number + 1}+'/'+${result.totalPages}"></span
          ><a th:if="${result.hasNext()}" th:href="@{/admin/announcements(page=${result.number + 1})}">次へ</a>
        </nav>
      </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script>
      document.querySelectorAll('.admin-user-row').forEach(function (row) {
        row.addEventListener('click', function (event) {
          if (event.target.closest('a, button, form')) return;
          window.location.href = row.dataset.url;
        });
        row.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') window.location.href = row.dataset.url;
        });
      });
    </script>
  </body>
</html>
