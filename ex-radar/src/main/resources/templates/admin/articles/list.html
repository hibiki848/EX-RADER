<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <title>記事管理 | EXレーダー</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/site-nav.js" defer></script>
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <div th:replace="~{fragments/header :: siteHeader}"></div>
    <main class="page admin-page">
      <div th:replace="~{fragments/header :: adminSubnav(current='articles')}"></div>
      <div class="page-heading">
        <p class="eyebrow">ADMIN CONSOLE</p>
        <h1>記事管理</h1>
        <p>公開記事の作成・編集・公開/非公開・削除ができます。</p>
      </div>
      <p class="success" th:if="${success}" th:text="${success}"></p>
      <p class="error" th:if="${error}" th:text="${error}"></p>
      <section class="panel reveal admin-users">
        <div class="section-heading">
          <div>
            <h2>記事一覧</h2>
            <p th:text="${#lists.size(articles)}+'件の記事'">件数</p>
          </div>
          <a class="button" href="/admin/articles/new">新規作成</a>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>タイトル</th>
                <th>URL(スラッグ)</th>
                <th>状態</th>
                <th>公開日</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="a : ${articles}">
                <td>
                  <a th:href="@{/admin/articles/{id}/edit(id=${a.id})}" th:text="${a.title}">タイトル</a>
                  <small
                    th:if="${a.seoTitle != null and !#strings.isEmpty(a.seoTitle)}"
                    th:text="'SEO: '+${a.seoTitle}"
                  ></small>
                </td>
                <td><small th:text="'/articles/'+${a.slug}">/articles/slug</small></td>
                <td>
                  <span
                    th:class="${a.status.name()=='PUBLISHED'} ? 'status-badge' : 'status-badge is-stopped'"
                    th:text="${a.status.name()=='PUBLISHED'} ? '公開中' : '下書き'"
                  ></span>
                </td>
                <td th:text="${a.publishedAt != null ? #temporals.format(a.publishedAt,'yyyy/MM/dd') : '-'}">-</td>
                <td class="admin-actions">
                  <a class="button button-secondary" th:href="@{/admin/articles/{id}/edit(id=${a.id})}">編集</a>
                  <form
                    th:if="${a.status.name()=='PUBLISHED'}"
                    th:action="@{/admin/articles/{id}/unpublish(id=${a.id})}"
                    method="post"
                  >
                    <button class="button button-secondary" type="submit">非公開にする</button>
                  </form>
                  <form
                    th:unless="${a.status.name()=='PUBLISHED'}"
                    th:action="@{/admin/articles/{id}/publish(id=${a.id})}"
                    method="post"
                  >
                    <button class="button" type="submit">公開する</button>
                  </form>
                  <form
                    th:action="@{/admin/articles/{id}/delete(id=${a.id})}"
                    method="post"
                    onsubmit="return confirm('この記事を削除しますか？')"
                  >
                    <button class="button button-danger" type="submit">削除</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <p th:if="${#lists.isEmpty(articles)}">記事はまだありません。「新規作成」から追加してください。</p>
      </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
