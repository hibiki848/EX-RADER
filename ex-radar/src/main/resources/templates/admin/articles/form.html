<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title th:text="${editing ? '記事を編集 | EXレーダー' : '記事を新規作成 | EXレーダー'}">記事の編集 | EXレーダー</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <header>
      <a class="brand" href="/">EXレーダー</a>
      <nav>
        <a href="/admin/articles">記事一覧に戻る</a>
      </nav>
    </header>
    <main class="form-page">
      <div class="page-heading">
        <p class="eyebrow">ADMIN CONSOLE</p>
        <h1 th:text="${editing ? '記事を編集' : '記事を新規作成'}">記事を編集</h1>
        <p th:if="${editing}" th:text="'状態: '+(${article.status.name()=='PUBLISHED'} ? '公開中' : '下書き')">状態</p>
      </div>
      <form
        class="experience-form"
        th:object="${articleForm}"
        th:action="${editing} ? @{/admin/articles/{id}(id=${article.id})} : @{/admin/articles}"
        method="post"
      >
        <div class="error-summary" th:if="${#fields.hasAnyErrors()}" role="alert">
          <strong>入力内容を確認してください</strong>
          <ul>
            <li th:each="e:${#fields.allErrors()}" th:text="${e}"></li>
          </ul>
        </div>
        <section class="panel form-section">
          <h2>基本情報</h2>
          <label
            >タイトル（必須）<input
              th:field="*{title}"
              maxlength="150"
              placeholder="例：転職で後悔しやすい7つのこと｜決める前に確認したいポイント" /><small th:errors="*{title}"></small
          ></label>
          <label
            >URL(スラッグ)（必須）<input th:field="*{slug}" maxlength="80" placeholder="例：tenshoku-koukai" /><span
              class="field-hint"
              >半角小文字英数字とハイフンのみ。公開URLは /articles/[このスラッグ] になります。</span
            ><small th:errors="*{slug}"></small
          ></label>
          <label
            >概要（必須・meta descriptionにも使用）<textarea th:field="*{description}" maxlength="300" rows="3"></textarea
            ><small th:errors="*{description}"></small
          ></label>
          <label
            >本文（必須）<textarea th:field="*{content}" maxlength="20000" rows="18"></textarea
            ><span class="field-hint"
              >「## 見出し」で見出し、「- 」で箇条書き、「**太字**」で太字、空行で段落を分けられます。</span
            ><small th:errors="*{content}"></small
          ></label>
        </section>
        <div class="owner-actions">
          <button class="button" type="submit" th:text="${editing} ? '変更を保存' : '下書きとして作成'">保存</button>
          <a class="button button-secondary" href="/admin/articles">キャンセル</a>
        </div>
      </form>
      <section class="panel form-section" th:if="${editing}">
        <h2>公開状態</h2>
        <p>本文の保存とは別に、公開・非公開だけを切り替えられます。</p>
        <form th:if="${article.status.name()=='PUBLISHED'}" th:action="@{/admin/articles/{id}/unpublish(id=${article.id})}" method="post">
          <button class="button button-secondary" type="submit">非公開にする</button>
        </form>
        <form th:unless="${article.status.name()=='PUBLISHED'}" th:action="@{/admin/articles/{id}/publish(id=${article.id})}" method="post">
          <button class="button" type="submit">公開する</button>
        </form>
      </section>
    </main>
  </body>
</html>
