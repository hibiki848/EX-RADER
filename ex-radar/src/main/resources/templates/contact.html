<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <th:block th:replace="~{fragments/favicon :: links}"></th:block>
    <title>お問い合わせ | EXレーダー</title>
    <th:block
      th:replace="~{fragments/seo :: meta(
        title='お問い合わせ | EXレーダー',
        description='EXレーダーに関するお問い合わせ窓口のご案内です。',
        canonicalUrl=${canonicalUrl},
        ogType='website')}"
    ></th:block>
    <meta name="robots" content="index, follow" />
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/site-nav.js" defer></script>
  </head>
  <body>
    <div th:replace="~{fragments/loading :: loading}"></div>
    <div th:replace="~{fragments/analytics :: analytics}"></div>
    <div th:replace="~{fragments/header :: siteHeader}"></div>
    <main class="page legal-page">
      <h1>お問い合わせ</h1>
      <div class="article-body">
        <p>EXレーダー（以下「本サービス」といいます。）に関するお問い合わせ窓口を準備中です。</p>
        <p>
          お問い合わせフォームまたは受付用メールアドレスを含む正式な窓口は、内容確定後に本ページで公開いたします。
        </p>
        <p>本サービスの利用条件については<a href="/terms">利用規約</a>を、個人情報の取扱いについては<a href="/privacy">プライバシーポリシー</a>をご確認ください。</p>
      </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
